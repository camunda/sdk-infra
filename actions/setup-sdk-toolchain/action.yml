# Composite action: Set up the language toolchain for a Camunda SDK repo.
#
# The agent workflows are otherwise identical across the five SDK repos; the
# toolchain is the one part that genuinely differs. Keeping it here means a
# caller only has to name its language rather than repeat a setup block.
#
# Usage:
#   - uses: camunda/sdk-infra/actions/setup-sdk-toolchain@v1
#     with:
#       language: python

name: Set up SDK toolchain
description: Install the language toolchain for a Camunda SDK repo, and optionally its dependencies.

inputs:
  language:
    description: 'SDK language: js, python, csharp, go, rust, or java.'
    required: true
  install-dependencies:
    description: >-
      Prefetch project dependencies after setting up the toolchain. Only js, python and go
      have a prefetch step (npm ci, uv sync, go mod download); for csharp, rust and java this
      is a no-op, because dotnet, cargo and maven all restore implicitly on the first build.
    required: false
    default: 'true'
  node-version:
    description: 'Node.js version. Node is installed for every language.'
    required: false
    default: '22'
  python-version:
    description: >-
      Python version. Installed for the python SDK, and for the go, rust and java SDKs
      whose Makefiles shell out to python3 for coverage, README-snippet checks and
      (for java) the code-generation post-processing hooks.
    required: false
    default: '3.12'
  dotnet-version:
    description: '.NET SDK version, used by the csharp SDK.'
    required: false
    default: '8.0.x'
  java-version:
    description: 'JDK version, used by the java SDK.'
    required: false
    default: '21'
  java-distribution:
    description: 'JDK distribution, used by the java SDK.'
    required: false
    default: 'temurin'

runs:
  using: composite
  steps:
    # Fail before any toolchain work, so a typo surfaces as a clear error rather
    # than as a job that quietly installs nothing and fails much later.
    - name: Validate the language input
      if: ${{ !contains(fromJSON('["js","python","csharp","go","rust","java"]'), inputs.language) }}
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
      run: |
        echo "::error::Unsupported language '${LANGUAGE}'. Expected one of: js, python, csharp, go, rust, java."
        exit 1

    # Node is installed for every language, not just the JS SDK: the Copilot CLI
    # and several shared scripts are npm-distributed, so Node is a dependency of
    # the workflow itself rather than of any one SDK.
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - if: inputs.language == 'python'
      uses: astral-sh/setup-uv@v7

    # Not only for the python SDK: the go and rust Makefiles run
    # `python3 scripts/…` for their coverage and README-snippet checks, the
    # rust verify gate calls the shared coverage script directly, and the java
    # code-generation pipeline drives its post-processing hooks with python3.
    # Pinning the version beats relying on whatever the runner image happens to
    # preinstall.
    - if: contains(fromJSON('["python","go","rust","java"]'), inputs.language)
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - if: inputs.language == 'csharp'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - if: inputs.language == 'go'
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    # rust-toolchain.toml pins the channel and the rustfmt/clippy components.
    # `rustup show` is the documented way to make rustup honour that file and
    # install on demand, so the toolchain is warm before the agent starts rather
    # than being installed mid-run by the first cargo invocation.
    - if: inputs.language == 'rust'
      shell: bash
      run: rustup show

    # `cache: maven` is what makes this worth centralising: the java SDK builds
    # four modules and openapi-generator pulls a large dependency tree, so an
    # uncached run pays for it on every job.
    - if: inputs.language == 'java'
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: maven

    - if: inputs.install-dependencies == 'true' && inputs.language == 'js'
      shell: bash
      run: npm ci

    - if: inputs.install-dependencies == 'true' && inputs.language == 'python'
      shell: bash
      run: uv sync --all-extras --dev

    - if: inputs.install-dependencies == 'true' && inputs.language == 'go'
      shell: bash
      run: go mod download

# Scheduled workflow: Daily check for new operations in the upstream spec.
#
# Bundles the spec from the default upstream branch and hands it to the reusable
# `sdk-detect-new-ops` workflow, which compares it against every SDK's
# operation-map.json and reconciles the tracking issues.
#
# Creates:
#   - A summary issue in sdk-infra with the full cross-SDK coverage table
#   - Per-SDK issues in each repo that has missing coverage (requires Vault secrets)
#   - All issues link to each other for traceability
#
# The detection logic itself deliberately lives only in sdk-detect-new-ops.yml.
# This workflow used to carry a second copy of it, which meant adding an SDK or
# fixing a comparison bug had to be done twice and stayed correct only by luck.
#
# Runs daily at 07:00 UTC (weekdays). Can also be triggered manually, or by an
# SDK whose example-coverage check just failed (see sdk-coverage-gap-dispatch.yml)
# so that an upstream change landing on a Friday is tracked before Monday.

name: Daily New Operations Check

on:
  schedule:
    - cron: '0 7 * * 1-5' # 07:00 UTC, Monday–Friday
  workflow_dispatch: {} # Allow manual trigger
  repository_dispatch:
    types: [coverage-gap]

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Fetch and bundle spec
        run: |
          mkdir -p current-spec
          npx --yes camunda-schema-bundler@2.4.5 \
            --ref main \
            --deref-path-local \
            --output-spec current-spec/rest-api.bundle.json \
            --output-metadata current-spec/spec-metadata.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundled-spec
          path: current-spec/
          retention-days: 1

  detect:
    needs: bundle
    # The summary issue in this repo is created/updated/closed with the default
    # GITHUB_TOKEN, which requires issues:write. Declared explicitly so the
    # workflow still works under read-only default token settings.
    permissions:
      contents: read
      issues: write
      id-token: write  # mint GitHub OIDC token for Vault JWT auth
    uses: ./.github/workflows/sdk-detect-new-ops.yml
    with:
      spec-artifact: bundled-spec
    secrets:
      vault-addr: ${{ secrets.VAULT_ADDR }}
      vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
      vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
      vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
      sdk-issue-token: ${{ secrets.SDK_ISSUE_TOKEN }}

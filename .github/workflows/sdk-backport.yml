# Reusable workflow: backport a merged PR onto stable branches, then regenerate the
# backport's generated code from the target branch's own spec.
#
# SDK repos commit generated code and squash-merge PRs, so a cherry-pick from main
# carries main's generated output, built from a newer upstream spec. This workflow
# cherry-picks the whole commit (hand-written runtime, infra and generator changes
# included), then, on each backport branch, restores the generated paths from the
# target branch, reruns the target branch's generator and commits the result
# separately. That also clears cherry-pick conflicts in generated files.
# Design history: camunda/orchestration-cluster-api-js#649, camunda/sdk-infra#81.
#
# Jobs:
#   backport    gate the sender; open the backport PRs with korthout/backport-action
#               as camunda-sdk-automation, so the target branch's required CI runs.
#   regenerate  one leg per backport PR. Runs the SDK's generator, so it holds no
#               credentials (contents: read, no id-token). Its only output is an
#               artifact: a status file and a git bundle of the regeneration commit.
#   publish     verifies each bundle (a fast-forward of the backport branch that
#               only touches generated paths), pushes it, and comments on failures.
#
# Per-repo configuration, read from the TARGET branch so each stable line describes
# its own generator (schema: schema/backport.schema.json):
#   .github/backport.yml                       generated paths, regenerate command,
#                                              language, do-not-backport rules
#   .github/actions/codegen-setup/action.yml   optional composite action for setup
#                                              beyond actions/setup-sdk-toolchain
#
# Usage (.github/workflows/backport.yml in the SDK repo):
#   on:
#     pull_request:
#       types: [closed, labeled]
#     issue_comment:
#       types: [created]
#   permissions: {}
#   concurrency:
#     group: backport-${{ github.event.pull_request.number || github.event.issue.number }}
#     cancel-in-progress: false
#   jobs:
#     backport:
#       permissions:
#         contents: read
#         id-token: write        # Vault JWT for the App key
#         pull-requests: write  # failure comments when the App token is unavailable
#       uses: camunda/sdk-infra/.github/workflows/sdk-backport.yml@v1
#       secrets:
#         VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
#         VAULT_JWT_PATH: ${{ secrets.VAULT_JWT_PATH }}
#         VAULT_JWT_ROLE: ${{ secrets.VAULT_JWT_ROLE }}
#         VAULT_JWT_AUDIENCE: ${{ secrets.VAULT_JWT_AUDIENCE }}
#
# `pull_request`, not `pull_request_target`: a PR from a fork gets no secrets on
# `pull_request`, so its backport is started with a `/backport` comment instead
# (issue_comment runs from the default branch). Writes go through the App token.

name: Backport

on:
  workflow_call:
    inputs:
      pull-title:
        description: >-
          korthout/backport-action pull_title template. Keep the original title first so
          the Conventional Commit type (and the release it triggers) survives.
        required: false
        default: '${pull_title} (backport #${pull_number} to ${target_branch})'
        type: string
      sdk-infra-ref:
        description: 'Ref of camunda/sdk-infra to load shared actions and scripts from.'
        required: false
        default: 'v1'
        type: string
      runs-on:
        required: false
        default: 'ubuntu-24.04'
        type: string
      regenerate-timeout-minutes:
        required: false
        default: 30
        type: number
    secrets:
      # Declared so callers can pass them explicitly instead of `secrets: inherit`.
      VAULT_ADDR:
        required: true
      VAULT_JWT_PATH:
        required: true
      VAULT_JWT_ROLE:
        required: true
      VAULT_JWT_AUDIENCE:
        required: true

permissions: {}

env:
  # korthout/backport-action's branch template; regenerate and publish find the
  # backport PRs of a source PR by this prefix.
  BRANCH_TEMPLATE: 'backport-${pull_number}-to-${target_branch}'
  BOT_ID: '290741040' # camunda-sdk-automation[bot]

jobs:
  backport:
    # A merged PR (closed, or labelled after the merge), or a `/backport` comment on
    # a PR from someone the repo trusts. Never react to the App's own comments.
    if: >-
      (
        github.event_name != 'issue_comment' &&
        github.event.pull_request.merged &&
        (github.event.action == 'closed' || startsWith(github.event.label.name, 'backport '))
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.id != 290741040 &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/backport')
      )
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write        # Vault JWT for the App key
      pull-requests: read
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
      source-pr: ${{ steps.prs.outputs.source-pr }}
      source-base: ${{ steps.prs.outputs.source-base }}
      was-successful: ${{ steps.backport.outputs.was_successful }}
      by-target: ${{ steps.backport.outputs.was_successful_by_target }}
    steps:
      # Merging needs write access, so a merge is trusted (the merger may be a bot,
      # e.g. Renovate). Labelling an already-merged PR (triage can label) and
      # commenting are re-checked against the sender's real repository permission;
      # author_association above is only a cheap pre-filter.
      - name: Check the sender may trigger backports
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_ID: ${{ github.event.sender.id }}
        run: |
          set -euo pipefail
          if [ "$SENDER_ID" = "$BOT_ID" ]; then
            echo "Sender is camunda-sdk-automation[bot]; allowed."
            exit 0
          fi
          role=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${SENDER}/permission" -q .role_name || true)
          case "$role" in
            admin|maintain|write) echo "${SENDER} has ${role} access; allowed." ;;
            *)
              echo "::error::${SENDER} has '${role:-no}' access to this repository; backports need write access."
              exit 1
              ;;
          esac

      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      # An App token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN trigger no
      # workflows, so the target branch's required checks would never run.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}

      # The default branch, never the source PR's head: the action cherry-picks the
      # merged commit itself.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create backport PRs
        id: backport
        uses: korthout/backport-action@ad272ff24e4a8593bf18a951a154ae6af93b26b8 # v5.0.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: camunda-sdk-automation[bot]
          git_committer_email: 290741040+camunda-sdk-automation[bot]@users.noreply.github.com
          # PRs often contain "Merge branch 'main'" commits; don't cherry-pick them.
          merge_commits: skip
          label_pattern: ^backport ([^ ]+)$
          branch_name: ${{ env.BRANCH_TEMPLATE }}
          pull_title: ${{ inputs.pull-title }}
          pull_description: |-
            Backport of #${pull_number} to `${target_branch}`.

            Generated code is restored from `${target_branch}` and regenerated by the Backport workflow in a separate `chore(gen)` commit.

            relates to ${issue_refs}
          # Bot authors (e.g. app/renovate) can't be assigned; the action logs and continues.
          add_author_as_assignee: true
          copy_labels_pattern: ^(?!backport ).*
          experimental: >
            {
              "conflict_resolution": "draft_commit_conflicts"
            }

      # Includes open backport PRs from earlier runs: on a retry the action reuses
      # existing branches and doesn't report them in created_pull_numbers, but a
      # failed regeneration must be retried.
      - name: List backport PRs to regenerate
        id: prs
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          source_base=$(gh pr view "$SOURCE_PR" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          prefix="${BRANCH_TEMPLATE%%\$\{target_branch\}}"
          prefix="${prefix//\$\{pull_number\}/$SOURCE_PR}"
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author app/camunda-sdk-automation \
            --limit 100 --json number,headRefName,baseRefName,headRepositoryOwner \
            --jq "[.[] | select(.headRepositoryOwner.login == env.GITHUB_REPOSITORY_OWNER)
                       | select(.headRefName | startswith(\"${prefix}\"))
                       | {pr: .number, branch: .headRefName, base: .baseRefName}]")
          echo "Backport PRs of #${SOURCE_PR} (from ${source_base}): ${prs}"
          {
            echo "prs=${prs}"
            echo "source-pr=${SOURCE_PR}"
            echo "source-base=${source_base}"
          } >> "$GITHUB_OUTPUT"

  # Runs the SDK's generator, so it gets a read-only token and nothing else: no
  # id-token (any step could otherwise mint a Vault JWT), no persisted credentials.
  regenerate:
    needs: backport
    if: ${{ !cancelled() && needs.backport.result != 'skipped' && needs.backport.outputs.prs != '' && needs.backport.outputs.prs != '[]' }}
    name: Regenerate #${{ matrix.pr }} (${{ matrix.base }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.regenerate-timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.backport.outputs.prs) }}
    env:
      PR: ${{ matrix.pr }}
      BRANCH: ${{ matrix.branch }}
      BASE: ${{ matrix.base }}
      SOURCE_PR: ${{ needs.backport.outputs.source-pr }}
      SOURCE_BASE: ${{ needs.backport.outputs.source-base }}
    steps:
      - name: Check out the backport branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      # Configuration and setup come from the target branch, not from the backport
      # branch, which carries whatever the source PR changed on main.
      - name: Check out the target branch's configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.base }}
          path: .backport-base
          sparse-checkout: |
            .github
          token: ${{ github.token }}
          persist-credentials: false

      # Loaded from a checkout rather than `camunda/sdk-infra/...@v1` so it tracks
      # `sdk-infra-ref`; a literal ref in `uses:` cannot be parameterised.
      - name: Check out shared sdk-infra helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: camunda/sdk-infra
          ref: ${{ inputs.sdk-infra-ref }}
          path: .sdk-infra
          persist-credentials: false

      - name: Prepare
        run: |
          set -euo pipefail
          printf '%s\n' '/.sdk-infra/' '/.backport-base/' >> .git/info/exclude
          out="${RUNNER_TEMP}/backport-out"
          mkdir -p "$out"
          echo "OUT=${out}" >> "$GITHUB_ENV"
          # Overwritten by every step that reaches a verdict.
          jq -n --argjson pr "$PR" --arg branch "$BRANCH" --arg base "$BASE" \
            '{pr: $pr, branch: $branch, base: $base, status: "failed", reason: "the regeneration job stopped before reaching a result"}' \
            > "${out}/status.json"
          git config user.name 'camunda-sdk-automation[bot]'
          git config user.email '290741040+camunda-sdk-automation[bot]@users.noreply.github.com'

      - name: Read .github/backport.yml from the target branch
        id: config
        run: |
          set -euo pipefail
          status() { jq --arg s "$1" --arg r "$2" '.status = $s | .reason = $r' "${OUT}/status.json" > "${OUT}/s.tmp" && mv "${OUT}/s.tmp" "${OUT}/status.json"; }
          cfg=.backport-base/.github/backport.yml
          if [ ! -f "$cfg" ]; then
            status no-config "\`${BASE}\` has no \`.github/backport.yml\`, so the generated paths and the regenerate command are unknown"
            echo "::error::${BASE} has no .github/backport.yml."
            exit 1
          fi
          yq -o=json '.' "$cfg" > "${RUNNER_TEMP}/backport.json"
          git diff -z --no-renames --name-only "origin/${BASE}...HEAD" > "${RUNNER_TEMP}/changed.txt"
          if ! node .sdk-infra/scripts/backport-config.mjs resolve --config "${RUNNER_TEMP}/backport.json" \
              --from "$SOURCE_BASE" --changed "${RUNNER_TEMP}/changed.txt" > "${RUNNER_TEMP}/resolved.json"; then
            status no-config "\`.github/backport.yml\` on \`${BASE}\` is invalid (see the run log)"
            exit 1
          fi
          cp "${RUNNER_TEMP}/resolved.json" "${OUT}/resolved.json"
          if [ "$(jq '.blocked | length' "${RUNNER_TEMP}/resolved.json")" -gt 0 ]; then
            # shellcheck disable=SC2016 # backticks in single quotes are Markdown
            list=$(jq -r '.blocked[] | "- `\(.file)` (rule `\(.pattern)`\(if .reason != "" then ": \(.reason)" else "" end))"' "${RUNNER_TEMP}/resolved.json")
            # shellcheck disable=SC2016 # backticks in single quotes are Markdown
            status blocked "$(printf 'it changes paths that `.github/backport.yml` on `%s` says must not be backported from `%s`:\n%s' "$BASE" "$SOURCE_BASE" "$list")"
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq '.generatedPaths | length' "${RUNNER_TEMP}/resolved.json")" -eq 0 ]; then
            status unchanged "this repository declares no generated paths"
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "action=regenerate" >> "$GITHUB_OUTPUT"
          echo "language=$(jq -r .language "${RUNNER_TEMP}/resolved.json")" >> "$GITHUB_OUTPUT"

      - name: Set up the toolchain
        if: steps.config.outputs.action == 'regenerate' && steps.config.outputs.language != ''
        uses: ./.sdk-infra/actions/setup-sdk-toolchain
        with:
          language: ${{ steps.config.outputs.language }}

      - name: Repo-specific codegen setup
        if: steps.config.outputs.action == 'regenerate' && hashFiles('.backport-base/.github/actions/codegen-setup/action.yml') != ''
        uses: ./.backport-base/.github/actions/codegen-setup

      - name: Restore generated paths from the target branch and regenerate
        id: regen
        if: steps.config.outputs.action == 'regenerate'
        run: |
          set -uo pipefail
          status() { jq --arg s "$1" --arg r "$2" '.status = $s | .reason = $r' "${OUT}/status.json" > "${OUT}/s.tmp" && mv "${OUT}/s.tmp" "${OUT}/status.json"; }
          mapfile -t paths < <(jq -r '.generatedPaths[]' "${RUNNER_TEMP}/resolved.json")
          regenerate=$(jq -r .regenerate "${RUNNER_TEMP}/resolved.json")

          # Conflicts the action committed in hand-written files are for a person to resolve.
          excludes=()
          for p in "${paths[@]}"; do excludes+=(":(exclude)${p}"); done
          # shellcheck disable=SC2016 # backticks in single quotes are Markdown
          if conflicted=$(git grep -lE '^(<<<<<<<|>>>>>>>) ' HEAD -- . "${excludes[@]}"); then
            status failed "$(printf 'the cherry-pick left conflicts in hand-written code:\n%s' "$(sed 's/^HEAD:/- `/; s/$/`/' <<< "$conflicted")")"
            exit 1
          fi

          for p in "${paths[@]}"; do
            if git cat-file -e "origin/${BASE}:${p}" 2>/dev/null; then
              git restore --source="origin/${BASE}" --staged --worktree -- "$p" || { status failed "could not restore \`${p}\` from \`${BASE}\`"; exit 1; }
            else
              # Generated on main only: remove it; the generator recreates it if the target produces it too.
              git rm -rq --ignore-unmatch -- "$p"
            fi
          done

          echo "Running: ${regenerate}"
          if ! bash -c "$regenerate"; then
            status failed "\`${regenerate}\` failed on \`${BASE}\`. Either the change depends on spec that \`${BASE}\` doesn't have (then it can't be backported as-is), or the regeneration needs fixing"
            exit 1
          fi

          # Only generated paths are committed; publish rejects anything else. A path is
          # staged if it exists or is still in the index (the generator deleted what
          # `git restore` put back); one that is in neither was removed by `git rm`.
          # --no-renames elsewhere: a rename lists only its destination otherwise.
          existing=()
          for p in "${paths[@]}"; do
            if [ -e "$p" ] || git ls-files --error-unmatch -- "$p" >/dev/null 2>&1; then existing+=("$p"); fi
          done
          if [ "${#existing[@]}" -gt 0 ]; then git add -A -- "${existing[@]}"; fi
          if git diff --cached --quiet HEAD; then
            status unchanged "generated code already matches \`${BASE}\`"
            exit 0
          fi
          git commit -q -m "chore(gen): regenerate for backport of #${SOURCE_PR}" \
            -m "Restore the generated paths from ${BASE} and regenerate from its committed spec." || { status failed "could not commit"; exit 1; }
          git bundle create "${OUT}/regen.bundle" HEAD "^origin/${BRANCH}"
          jq --arg sha "$(git rev-parse HEAD)" --arg base_sha "$(git rev-parse "origin/${BRANCH}")" \
            '.status = "changed" | .reason = "" | .sha = $sha | .branchSha = $base_sha' "${OUT}/status.json" > "${OUT}/s.tmp" \
            && mv "${OUT}/s.tmp" "${OUT}/status.json"
          git diff --stat HEAD~1 HEAD | tail -1

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backport-regen-${{ matrix.pr }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Holds the credentials the regenerate job lacks, and runs nothing from the repo.
  publish:
    needs: [backport, regenerate]
    if: ${{ always() && needs.backport.result != 'skipped' && needs.backport.outputs.prs != '' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write        # Vault JWT for the App key
      pull-requests: write   # report failures with GITHUB_TOKEN when the App token is unavailable
    env:
      PRS: ${{ needs.backport.outputs.prs }}
      SOURCE_PR: ${{ needs.backport.outputs.source-pr }}
      WAS_SUCCESSFUL: ${{ needs.backport.outputs.was-successful }}
      BY_TARGET: ${{ needs.backport.outputs.by-target }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Check out shared sdk-infra helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: camunda/sdk-infra
          ref: ${{ inputs.sdk-infra-ref }}
          path: .sdk-infra
          persist-credentials: false

      - name: Download regeneration results
        if: env.PRS != '[]'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: backport-regen-*
          path: ${{ runner.temp }}/results

      - name: Import secrets
        id: secrets
        if: env.PRS != '[]'
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        if: env.PRS != '[]'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}

      # The PR list comes from the backport job, not from the artifacts. Each bundle
      # is pushed only if it is a fast-forward of its backport branch whose changes
      # all lie under the target branch's generated paths.
      - name: Push regenerated code and report
        if: env.PRS != '[]'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          failed=0
          REMOTE="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Every PR whose outcome is known (pushed, unchanged, or explained in a
          # comment) is recorded; the next step reports on all the others.
          reported="${RUNNER_TEMP}/reported.txt"
          : > "$reported"
          comment() {
            if gh pr comment "$1" --repo "$GITHUB_REPOSITORY" --body "$2"; then
              echo "$1" >> "$reported"
            else
              echo "::error::Could not comment on #$1."
            fi
          }
          publish_one() {
            local pr=$1 branch=$2 base=$3 dir="${RUNNER_TEMP}/results/backport-regen-$1"
            local status reason sha
            if [ ! -f "${dir}/status.json" ]; then
              comment "$pr" "The Backport workflow could not regenerate the generated code on this backport (no result; see the [run](${RUN_URL})). It may still carry the generated files of #${SOURCE_PR}'s branch."
              return 1
            fi
            status=$(jq -r .status "${dir}/status.json")
            reason=$(jq -r .reason "${dir}/status.json")
            case "$status" in
              unchanged)
                echo "#${pr}: ${reason}."
                return 0
                ;;
              blocked)
                # shellcheck disable=SC2016 # backticks in single quotes are Markdown
                comment "$pr" "$(printf 'This backport should not be merged as-is: %s\n\nClose it, or reduce it to the changes that apply to `%s`. ([run](%s))' "$reason" "$base" "$RUN_URL")"
                return 1
                ;;
              changed) ;;
              *)
                comment "$pr" "$(printf 'Could not regenerate the generated code on this backport: %s. It may still carry the generated files of the source branch. See the [run](%s) and the \"Backporting to stable branches\" section of AGENTS.md.' "$reason" "$RUN_URL")"
                return 1
                ;;
            esac

            sha=$(jq -r .sha "${dir}/status.json")
            # Authenticated: the checkout persisted no credentials, and some SDK repos are internal.
            git fetch -q "$REMOTE" "+refs/heads/${branch}:refs/remotes/origin/${branch}" \
              "+refs/heads/${base}:refs/remotes/origin/${base}" || return 1
            git bundle verify -q "${dir}/regen.bundle" || { echo "::error::#${pr}: invalid bundle."; return 1; }
            git fetch -q --no-tags "${dir}/regen.bundle" HEAD || return 1
            if [ "$(git rev-parse FETCH_HEAD)" != "$sha" ]; then
              echo "::error::#${pr}: bundle head is not the reported ${sha}."; return 1
            fi
            if [ "$(git rev-list --count "origin/${branch}..${sha}")" != 1 ] || ! git merge-base --is-ancestor "origin/${branch}" "$sha"; then
              comment "$pr" "The regenerated code was not pushed: \`${branch}\` moved while it was being regenerated. Comment \`/backport\` on #${SOURCE_PR} to retry. ([run](${RUN_URL}))"
              return 1
            fi
            git show "origin/${base}:.github/backport.yml" | yq -o=json '.' > "${RUNNER_TEMP}/cfg-${pr}.json" || return 1
            git diff -z --no-renames --name-only "origin/${branch}" "$sha" > "${RUNNER_TEMP}/diff-${pr}.txt"
            if ! node .sdk-infra/scripts/backport-config.mjs check-diff --config "${RUNNER_TEMP}/cfg-${pr}.json" --changed "${RUNNER_TEMP}/diff-${pr}.txt"; then
              echo "::error::#${pr}: the regeneration commit touches non-generated paths; not pushing."
              return 1
            fi
            git push -q "$REMOTE" "${sha}:refs/heads/${branch}" || return 1
            echo "#${pr}: pushed regenerated code (${sha})."
          }
          while read -r pr branch base; do
            echo "::group::#${pr} (${branch} -> ${base})"
            if publish_one "$pr" "$branch" "$base"; then
              echo "$pr" >> "$reported"
            else
              failed=1
              # A failure after regeneration succeeded (fetch, bundle or diff check, push)
              # has no comment of its own yet.
              grep -qx "$pr" "$reported" || comment "$pr" "The regenerated code for this backport could not be pushed, so it may still carry the generated files of #${SOURCE_PR}'s branch. See the [run](${RUN_URL}); comment \`/backport\` on #${SOURCE_PR} to retry."
            fi
            echo "::endgroup::"
          done < <(jq -r '.[] | "\(.pr) \(.branch) \(.base)"' <<< "$PRS")
          exit "$failed"

      # Independent of Vault, the App token and the step above: if any of them failed,
      # the backport PRs it didn't report on still learn why they kept the source
      # branch's generated code.
      - name: Report unpublished backports
        if: always() && env.PRS != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          reported="${RUNNER_TEMP}/reported.txt"
          touch "$reported"
          missing=0
          while read -r pr; do
            grep -qx "$pr" "$reported" && continue
            missing=1
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "The Backport workflow could not publish regenerated code for this backport, so it may still carry the generated files of #${SOURCE_PR}'s branch. See the [run](${RUN_URL}); comment \`/backport\` on #${SOURCE_PR} to retry." \
              || echo "::error::Could not comment on #${pr}."
          done < <(jq -r '.[].pr' <<< "$PRS")
          exit "$missing"

      # The action only fails its step on unexpected errors. When a target can't be
      # backported it comments on the source PR and reports was_successful=false.
      - name: Fail if a target could not be backported
        if: ${{ !cancelled() && env.WAS_SUCCESSFUL == 'false' }}
        run: |
          echo "::error::Backport failed for some targets: ${BY_TARGET}. See the comment on the source PR."
          exit 1

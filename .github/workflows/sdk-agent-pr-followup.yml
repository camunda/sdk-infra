# Reusable workflow: react to feedback on an agent-authored pull request.
#
# The example-coverage agent opens a PR and then goes silent: it cannot react to
# a CI failure or to review feedback. This workflow closes that loop by re-running
# the Copilot CLI on an existing agent branch.
#
# Three ways in:
#   1. `/agent fix [instructions]` in a PR comment — human-directed, uncapped.
#   2. A CI run failing on an agent branch — automatic.
#   3. A review submitted by a *different* bot reviewer (e.g. the Copilot PR
#      reviewer) — automatic. A second opinion catches things the author missed.
#
# The two automatic paths share a hard attempt cap (see max-auto-attempts) tracked
# with `agent-attempt-N` labels, so a fix → CI → fix → review → fix chain always
# terminates instead of burning Copilot runs in a loop. Human `/agent fix` bypasses
# the cap, because a person is deciding each time.
#
# Only branches matching the agent branch prefix are eligible, and the agent never
# reacts to its own output. A CI failure is also ignored once the branch has moved
# past the commit that failed, so the duplicate failure a repo gets from running CI
# on both `push` and `pull_request` cannot trigger a second, redundant fix.
#
# The caller owns the triggers (it names its own CI workflow in `workflow_run`) and
# grants the job permissions — a reusable workflow cannot elevate beyond the caller.
#
# Usage:
#   on:
#     issue_comment:
#       types: [created]
#     pull_request_review:
#       types: [submitted]
#     workflow_run:
#       workflows: ["PR & Branch CI"]
#       types: [completed]
#   jobs:
#     followup:
#       permissions:
#         contents: read
#         id-token: write
#         copilot-requests: write
#         pull-requests: write
#         issues: write
#         actions: read
#       uses: camunda/sdk-infra/.github/workflows/sdk-agent-pr-followup.yml@v1
#       secrets:
#         VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
#         VAULT_JWT_PATH: ${{ secrets.VAULT_JWT_PATH }}
#         VAULT_JWT_ROLE: ${{ secrets.VAULT_JWT_ROLE }}
#         VAULT_JWT_AUDIENCE: ${{ secrets.VAULT_JWT_AUDIENCE }}
#       with:
#         language: js
#         verify-commands: |
#           npm run typecheck
#           npm test

name: Agent — PR follow-up

on:
  workflow_call:
    inputs:
      language:
        description: 'SDK language: js, python, csharp, go, or rust.'
        required: true
        type: string
      verify-commands:
        description: >-
          Newline-separated commands that define "verified" for this repo. The
          verify step runs exactly these and the agent prompt is handed exactly
          these, so the gate and the agent's understanding of it cannot drift.
        required: true
        type: string
      verify-artifacts:
        description: >-
          Newline-separated glob patterns for tracked files the verify commands
          are allowed to regenerate (lockfiles, recorded fixtures). Changes to
          these after verification are committed; anything else fails the run.
        required: false
        default: ''
        type: string
      extra-instructions:
        description: >-
          Repo-specific guidance appended to the agent prompt — conventions a
          verify command would only surface as a late failure.
        required: false
        default: ''
        type: string
      max-auto-attempts:
        description: 'Budget shared by the CI and review paths, per pull request.'
        required: false
        default: 2
        type: number
      agent-branch-prefix:
        description: 'Only branches with this prefix are eligible.'
        required: false
        default: 'agent/example-coverage-'
        type: string
      sdk-infra-ref:
        description: 'Ref of camunda/sdk-infra to load shared actions and scripts from.'
        required: false
        default: 'v1'
        type: string
      copilot-model:
        description: 'Model passed to the Copilot CLI.'
        required: false
        default: 'claude-sonnet-4.6'
        type: string
      runs-on:
        required: false
        default: 'ubuntu-24.04'
        type: string
      timeout-minutes:
        required: false
        default: 45
        type: number
    secrets:
      # These four are the only secrets this workflow uses, and callers are
      # expected to pass them explicitly rather than `secrets: inherit` — the
      # job hands the repo to an LLM agent, so the blast radius is worth
      # keeping small. Declaring them is what makes explicit passing work: an
      # undeclared secret resolves only under `inherit`, so an explicit caller
      # would otherwise reach Vault with an empty address and fail obscurely.
      VAULT_ADDR:
        required: true
      VAULT_JWT_PATH:
        required: true
      VAULT_JWT_ROLE:
        required: true
      VAULT_JWT_AUDIENCE:
        required: true

jobs:
  triage:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write   # attempt labels
      issues: write          # PR labels and comments go through the Issues API
    concurrency:
      group: agent-followup-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    outputs:
      eligible: ${{ steps.decide.outputs.eligible }}
      pr: ${{ steps.decide.outputs.pr }}
      branch: ${{ steps.decide.outputs.branch }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide whether to run the agent
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          MAX_AUTO_ATTEMPTS: ${{ inputs.max-auto-attempts }}
          AGENT_BRANCH_PREFIX: ${{ inputs.agent-branch-prefix }}
          # issue_comment
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ASSOC: ${{ github.event.comment.author_association }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          ISSUE_PR_NUMBER: ${{ github.event.issue.number }}
          # pull_request_review
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
          REVIEW_AUTHOR_TYPE: ${{ github.event.review.user.type }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          # workflow_run
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "eligible=false" >> "$GITHUB_OUTPUT"

          # Never react to our own output, or to any actor that this workflow drives.
          is_self() {
            case "$1" in
              github-actions\[bot\]|camunda-sdk-automation\[bot\]) return 0 ;;
              *) return 1 ;;
            esac
          }

          pr=""; reason=""; capped="true"

          case "$EVENT" in
            issue_comment)
              [ "$IS_PR" = "true" ] || { echo "Not a PR comment."; exit 0; }
              is_self "$COMMENT_AUTHOR" && { echo "Own comment; ignoring."; exit 0; }
              # The command must open the comment (leading whitespace allowed) rather
              # than appear anywhere in it, so prose that merely mentions the command
              # — "please don't /agent fix this" — cannot start a privileged run.
              first_line="$(printf '%s\n' "$COMMENT_BODY" | head -n 1 | sed 's/^[[:space:]]*//')"
              case "$first_line" in
                "/agent fix"*) ;;
                *) echo "Comment does not start with /agent fix."; exit 0 ;;
              esac
              # This command mints an App token and runs Copilot with --yolo, so it
              # must not be steerable by arbitrary commenters on a public repo.
              case "$COMMENT_ASSOC" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  echo "::warning::/agent fix from ${COMMENT_AUTHOR} (${COMMENT_ASSOC}) ignored — not a repo collaborator."
                  gh pr comment "$ISSUE_PR_NUMBER" --repo "$GH_REPO" --body \
                    "🤖 Only repository collaborators can run \`/agent fix\`." \
                    || echo "::warning::Could not comment."
                  exit 0
                  ;;
              esac
              pr="$ISSUE_PR_NUMBER"
              reason="comment"
              capped="false"   # a human asked for this explicitly
              ;;
            pull_request_review)
              [ "$REVIEW_STATE" != "approved" ] || { echo "Approving review; nothing to fix."; exit 0; }
              is_self "$REVIEW_AUTHOR" && { echo "Own review; ignoring."; exit 0; }
              # Classify by account type, not by a `[bot]` login suffix: the webhook
              # reports Copilot's code review as login `Copilot` (the REST API calls
              # the same account `copilot-pull-request-reviewer[bot]`), so a suffix
              # test reads the review we most want to act on as a human one.
              [ "$REVIEW_AUTHOR_TYPE" = "Bot" ] \
                || { echo "Human review by ${REVIEW_AUTHOR}: leave it to /agent fix so the reviewer stays in control."; exit 0; }
              pr="$REVIEW_PR_NUMBER"
              reason="review"
              ;;
            workflow_run)
              [ "$RUN_CONCLUSION" = "failure" ] || { echo "CI did not fail."; exit 0; }
              case "$RUN_HEAD_BRANCH" in
                "${AGENT_BRANCH_PREFIX}"*) ;;
                *) echo "Not an agent branch."; exit 0 ;;
              esac
              pr="$(gh pr list --repo "$GH_REPO" --head "$RUN_HEAD_BRANCH" --state open \
                --json number,headRepositoryOwner \
                --jq "[.[] | select(.headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\")] | .[0].number // empty")"
              [ -n "$pr" ] || { echo "No open PR for ${RUN_HEAD_BRANCH}."; exit 0; }
              # A repo whose CI runs on both `push` and `pull_request` reports two
              # failures per commit, so a fix pushed for the first leaves the second
              # describing a tree that no longer exists. Acting on it re-runs the
              # agent against work that is already done and burns an attempt.
              head_sha="$(gh pr view "$pr" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')"
              [ "$head_sha" = "$RUN_HEAD_SHA" ] \
                || { echo "Branch moved on from ${RUN_HEAD_SHA}; stale failure."; exit 0; }
              reason="ci"
              ;;
          esac

          branch="$(gh pr view "$pr" --repo "$GH_REPO" --json headRefName --jq '.headRefName')"
          case "$branch" in
            "${AGENT_BRANCH_PREFIX}"*) ;;
            *) echo "PR #${pr} is not an agent branch (${branch})."; exit 0 ;;
          esac

          # Automatic paths share one budget so fix → CI → fix → review cannot loop.
          if [ "$capped" = "true" ]; then
            # Filter before parsing: `capture` errors on a non-matching label, which
            # under `set -e` would abort triage for any PR carrying other labels.
            used="$(gh pr view "$pr" --repo "$GH_REPO" --json labels \
              --jq '[.labels[].name
                       | select(test("^agent-attempt-[0-9]+$"))
                       | sub("^agent-attempt-"; "")
                       | tonumber] | max // 0')"
            if [ "$used" -ge "$MAX_AUTO_ATTEMPTS" ]; then
              echo "::warning::PR #${pr} has used all ${MAX_AUTO_ATTEMPTS} automatic attempts."
              gh pr comment "$pr" --repo "$GH_REPO" --body \
                "🤖 I've used my ${MAX_AUTO_ATTEMPTS} automatic follow-up attempts on this PR without getting it green, so I'm stopping to avoid a loop. Comment \`/agent fix <what to change>\` if you want me to try again with direction." \
                || echo "::warning::Could not comment on #${pr}."
              exit 0
            fi
            next=$((used + 1))
            gh pr edit "$pr" --repo "$GH_REPO" --add-label "agent-attempt-${next}" \
              || echo "::warning::Could not label #${pr}."
          fi

          {
            echo "eligible=true"
            echo "pr=${pr}"
            echo "branch=${branch}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"

  fix:
    needs: triage
    if: needs.triage.outputs.eligible == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write
      copilot-requests: write
      pull-requests: write
      issues: write          # the outcome comment goes through the Issues API
      actions: read          # `gh run view --log-failed` reads the failing run's log
    env:
      VERIFY_COMMANDS: ${{ inputs.verify-commands }}
      VERIFY_ARTIFACTS: ${{ inputs.verify-artifacts }}
      EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
      BRANCH: ${{ needs.triage.outputs.branch }}
    steps:
      - name: Check out the agent branch
        uses: actions/checkout@v6
        with:
          # Read-only token and no persisted credentials while the agent runs with
          # --yolo; the app token is introduced only at push time.
          token: ${{ github.token }}
          persist-credentials: false
          ref: ${{ needs.triage.outputs.branch }}
          fetch-depth: 0

      # Loaded from a checkout rather than a `camunda/sdk-infra/...@v1` reference
      # so the helpers track `sdk-infra-ref`; a literal ref in `uses:` cannot be
      # parameterised, so a branch build would silently run the v1 helpers.
      - name: Check out shared sdk-infra helpers
        uses: actions/checkout@v6
        with:
          repository: camunda/sdk-infra
          ref: ${{ inputs.sdk-infra-ref }}
          path: .sdk-infra
          persist-credentials: false

      - name: Hide the helper checkout from the SDK working tree
        run: |
          set -euo pipefail
          echo '/.sdk-infra/' >> .git/info/exclude
          echo "SDK_INFRA=${GITHUB_WORKSPACE}/.sdk-infra" >> "$GITHUB_ENV"

      - name: Set up the toolchain
        uses: ./.sdk-infra/actions/setup-sdk-toolchain
        with:
          language: ${{ inputs.language }}

      - name: Install Copilot CLI
        env:
          COPILOT_CLI_VERSION: ${{ vars.COPILOT_CLI_VERSION || 'latest' }}
        run: npm install -g "@github/copilot@${COPILOT_CLI_VERSION}"

      # Minted after the dependency installs above, so a compromised package
      # cannot read a live credential out of the job environment.
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/onboarding-and-migration/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/onboarding-and-migration/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # The token only ever pushes to the repo being worked on.
          repositories: ${{ github.event.repository.name }}

      - name: Configure committer identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Collect the feedback to act on
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.triage.outputs.pr }}
          REASON: ${{ needs.triage.outputs.reason }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_ID: ${{ github.event.review.id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Feedback is author-controlled text, so it goes to a file rather than
          # through $GITHUB_OUTPUT or an env var interpolated into the prompt.
          case "$REASON" in
            comment)
              printf '%s\n' "$COMMENT_BODY" > /tmp/feedback.md
              ;;
            review)
              {
                printf '%s\n\n' "$REVIEW_BODY"
                echo "Inline comments:"
                gh api "repos/${GH_REPO}/pulls/${PR}/comments" \
                  --jq ".[] | select(.pull_request_review_id == ${REVIEW_ID}) | \"- \(.path):\(.line // .original_line) — \(.body)\"" \
                  || true
              } > /tmp/feedback.md
              ;;
            ci)
              # stderr is deliberately not silenced: if this cannot read the log
              # (missing `actions: read`, expired logs), that has to be visible in the
              # run log rather than degrading into an empty prompt the agent guesses at.
              log="$(gh run view "$RUN_ID" --repo "$GH_REPO" --log-failed | tail -n 200 || true)"
              if [ -z "${log//[[:space:]]/}" ]; then
                echo "::error::No failing-step output for run ${RUN_ID}; refusing to run the agent with no feedback."
                exit 1
              fi
              {
                echo "The CI run failed. Failing step output:"
                echo
                printf '%s\n' "$log"
              } > /tmp/feedback.md
              ;;
          esac
          echo "Collected $(wc -l < /tmp/feedback.md) lines of feedback."

      - name: Run Copilot CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ needs.triage.outputs.pr }}
          REASON: ${{ needs.triage.outputs.reason }}
          COPILOT_MODEL: ${{ inputs.copilot-model }}
        run: |
          set -euo pipefail

          # The feedback is author-controlled (a CI log, a bot review, a comment), so it
          # is never interpolated into a heredoc: a line equal to the terminator would
          # truncate or rewrite the prompt. Static parts use quoted heredocs and the
          # feedback is spliced in as plain data between them.
          {
            cat <<'PROMPT_HEAD'
          You are working on the branch of the pull request named below, which you opened
          earlier to add SDK example coverage.

          Read AGENTS.md first and follow it strictly.

          Something needs fixing. The trigger and the feedback to act on follow.
          PROMPT_HEAD
            printf '\n  Repository: %s\n  Pull request: #%s\n  Branch: %s\n  Trigger: %s\n\n' \
              "$GITHUB_REPOSITORY" "$PR" "$BRANCH" "$REASON"
            echo "  Feedback:"
            sed 's/^/  /' /tmp/feedback.md
            cat <<'PROMPT_TAIL'

          Do the following:
          1. Work out the root cause and fix it properly — do not paper over a failing
             check by weakening or skipping it.
          2. Stay inside the example surface: examples/, examples/operation-map.json, the
             docs the repo requires for a new operation, and regenerated SDK output. Do
             NOT modify generator sources (hooks/, scripts/, the generator project). If
             the pipeline itself looks like it needs changing, stop and explain that in
             your final message instead of editing it.
          3. If the feedback asks for a richer example, remember what a good one looks
             like: a meaningful filter value rather than an empty request object, a page
             limit where the operation is paginated, the consistency option where the
             operation is eventually consistent, and something done with the result.
          4. If you disagree with the feedback, do not change the code — explain your
             reasoning in your final message instead. Making no commits is a valid
             outcome and is reported as such.
          5. Commit every change you make and leave the working tree clean.
          6. Read AGENTS.md for the build/verification pipeline, then finish by running
             the exact commands below. They are the gate this workflow applies: a green
             lint, typecheck or test run does NOT mean they pass. Do not stop until
             every one of them passes.
          PROMPT_TAIL
            # $( ) strips every trailing newline, so the blank line before the
            # closing instruction is emitted here and does not depend on how
            # VERIFY_COMMANDS happens to be quoted.
            printf '%s\n\n' "$(printf '%s' "$VERIFY_COMMANDS" | sed 's/^/      /')"
            # Repo-specific conventions a verify command would only surface as a
            # late failure. Guarded on non-whitespace so an unset input does not
            # leave a dangling heading in the prompt.
            if [ -n "${EXTRA_INSTRUCTIONS//[[:space:]]/}" ]; then
              printf 'Also specific to this repository:\n\n'
              printf '%s\n\n' "$EXTRA_INSTRUCTIONS"
            fi
            cat <<'PROMPT_FOOT'
          Do not push and do not open a pull request — the workflow does that.
          PROMPT_FOOT
          } > /tmp/prompt.md

          copilot --yolo -p "$(cat /tmp/prompt.md)" --model "$COPILOT_MODEL"

      # Checked here rather than after verification, because this is the only
      # moment at which a dirty tree unambiguously means the agent left work
      # uncommitted. "Nothing to do" is also settled here: deciding not to change
      # anything is a legitimate outcome, and running the verify commands for it
      # only risks dirtying the tree with their own regenerated output.
      - name: Inspect the agent's output
        id: agent
        run: |
          set -euo pipefail

          # --porcelain rather than `git diff`, so untracked leftovers (scratch files,
          # stray build output) also fail the run. The prompt demands a clean tree, and
          # tracked-only checks let the most common form of mess through. Ignored paths
          # are still excluded, so normal build artefacts do not trip this.
          if [ -n "$(git -c core.quotepath=false status --porcelain --untracked-files=all)" ]; then
            echo "::error::The agent left the working tree dirty; refusing to push a partial fix."
            git status --short
            exit 1
          fi

          if [ -z "$(git log --oneline "origin/${BRANCH}..HEAD")" ]; then
            echo "::notice::The agent made no commits — nothing to push."
            echo "has-commits=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has-commits=true" >> "$GITHUB_OUTPUT"

      - name: Verify
        if: steps.agent.outputs.has-commits == 'true'
        run: |
          # `:?` so an empty or unset constant aborts here: `bash -c ""` exits 0,
          # which would turn a missing gate into a silently passing one.
          bash -euo pipefail -c "${VERIFY_COMMANDS:?is empty; refusing to run an empty verify gate}"

      # Some verify commands legitimately rewrite tracked files — a lockfile, a
      # recorded response fixture. Those belong in the push, so they are committed
      # here against an explicit allow-list. Anything outside it is an unexplained
      # mutation and still fails.
      - name: Commit artefacts regenerated by verification
        if: steps.agent.outputs.has-commits == 'true'
        run: |
          set -euo pipefail

          git -c core.quotepath=false status --porcelain --untracked-files=all | cut -c4- > /tmp/dirty-paths.txt
          if [ ! -s /tmp/dirty-paths.txt ]; then
            echo "Verification left the working tree clean."
            exit 0
          fi
          printf '%s\n' "$VERIFY_ARTIFACTS" > /tmp/verify-artifacts.txt

          allowed=true
          unexpected=""
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            match=false
            while IFS= read -r pattern; do
              [ -n "$pattern" ] || continue
              # shellcheck disable=SC2254  # the pattern is an intentional glob
              case "$path" in $pattern) match=true; break ;; esac
            done < /tmp/verify-artifacts.txt
            if [ "$match" = false ]; then
              allowed=false
              unexpected="${unexpected}  ${path}
          "
            fi
          done < /tmp/dirty-paths.txt

          if [ "$allowed" = false ]; then
            echo "::error::Verification changed files that are not declared in verify-artifacts:"
            printf '%s' "$unexpected"
            echo "Either make the verify commands non-mutating, or add these paths to the workflow's verify-artifacts input."
            exit 1
          fi

          git add -A
          git commit -m "chore: sync artefacts regenerated by verification"
          echo "Committed regenerated artefacts."

      - name: Push the fix
        id: push
        if: steps.agent.outputs.has-commits == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git push \
            "https://x-access-token:${APP_TOKEN}@github.com/${GH_REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Report back on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.triage.outputs.pr }}
          REASON: ${{ needs.triage.outputs.reason }}
          RESULT: ${{ job.status }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "${RESULT}:${PUSHED:-false}" in
            success:true)
              msg="🤖 Pushed a fix in response to the ${REASON} feedback. Checks will re-run — please re-review." ;;
            success:false)
              msg="🤖 I looked at the ${REASON} feedback but made no changes. See the [run log](${RUN_URL}) for my reasoning — this one needs a human." ;;
            *)
              msg="🤖 My follow-up attempt failed — see the [run log](${RUN_URL}). Comment \`/agent fix <what to change>\` to point me at it more precisely." ;;
          esac
          gh pr comment "$PR" --repo "$GH_REPO" --body "$msg" \
            || echo "::warning::Could not comment on #${PR}."

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# An older run finishing after a newer one would push `v1` backward.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: NODE_AUTH_TOKEN="" npx semantic-release

      # Downstream repos consume the workflows and actions at `@v1`, so a merge is
      # inert until this moves. Doing it here rather than by hand also keeps it
      # after semantic-release's `git fetch --tags`, which fails if the tag moves
      # underneath a run.
      - name: Move the v1 major tag
        run: |
          set -euo pipefail
          # Re-running a historical release would otherwise regress consumers to
          # whatever `main` looked like then. Ask the remote rather than trusting
          # the remote-tracking ref checkout left behind.
          head="$(git ls-remote origin "$GITHUB_REF" | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::${GITHUB_REF} is now ${head:-gone}; leaving v1 for that run."
            exit 0
          fi
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin refs/tags/v1
